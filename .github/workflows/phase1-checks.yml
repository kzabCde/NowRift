name: Phase 1 demo checks

on:
  pull_request:
    branches: [main, 'feat/**', 'fix/**']
  push:
    branches: ['feat/**', 'fix/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript checks
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build test (no deploy)
        run: npm run build
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (desktop + mobile + offline)
        run: npm run test:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nowrift-browser-failures
          path: |
            test-results/
          retention-days: 7
          if-no-files-found: ignore
