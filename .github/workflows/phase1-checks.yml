name: NowRift gameplay, campaign and RPG checks

on:
  pull_request:
    branches: [main, feat/phase-1-mobile-pwa]
  push:
    branches:
      [
        fix/gameplay-stability-mobile,
        "codex/**",
        feature/character-first-rift-heaven,
        feature/character-weapon-decoupling,
      ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript checks
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: |
          npx prettier --write src/game/persistence/checkpoint.ts src/game/world/content.ts src/game/world/farming.ts src/game/world/world.test.ts src/components/NowRiftMainMenu.tsx src/components/WorldMap.tsx
          git diff -- src/game/persistence/checkpoint.ts src/game/world/content.ts src/game/world/farming.ts src/game/world/world.test.ts src/components/NowRiftMainMenu.tsx src/components/WorldMap.tsx
          exit 1
      - name: Unit tests
        run: npm test
      - name: Seeded full survival and boss playthrough
        run: npm run test:playthrough
      - name: Production build test (no deploy)
        run: NEXT_PUBLIC_E2E=1 npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (combat, campaign, RPG economy, responsive and PWA)
        run: NOWRIFT_E2E=1 npm run test:browser
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nowrift-guest-menu-browser-tests
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
