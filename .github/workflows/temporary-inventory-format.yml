name: Temporary inventory branch formatter
on:
  push:
    branches:
      - feature/inventory-expansion-bulk-actions-20261113
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed inventory files
        run: |
          npx prettier --write src/game/rpg/bag.ts src/game/rpg/profile.ts src/game/rpg/inventory.ts src/game/rpg/actions.ts src/game/rpg/inventory-management.test.ts src/components/RpgScreen.tsx src/app/rpg.css src/i18n/dictionaries/rpg-th.ts e2e/rpg.spec.ts
      - name: Commit formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/game/rpg/bag.ts src/game/rpg/profile.ts src/game/rpg/inventory.ts src/game/rpg/actions.ts src/game/rpg/inventory-management.test.ts src/components/RpgScreen.tsx src/app/rpg.css src/i18n/dictionaries/rpg-th.ts e2e/rpg.spec.ts
            git commit -m "style(rpg): apply Prettier to inventory implementation"
            git push
          fi
